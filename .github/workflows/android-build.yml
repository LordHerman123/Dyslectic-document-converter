name: Android build (phones and tablets, in development)

# Builds the Android app with `flet build apk` (Flet installs Flutter, the Android SDK and Java itself). The APKs
# (one per processor type; most phones and tablets need arm64-v8a) are under the workflow run's artifacts.
on:
  push:
    branches: [android_dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet's build tools
        run: |
          python -m pip install --upgrade pip
          pip install "flet-cli==1.0.1" "flet==1.0.1"

      - name: Run the tests that check the Android pieces on this machine
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q tests/test_android.py

      - name: flet build apk
        env:
          PYTHONIOENCODING: utf-8
        run: flet build apk --yes --verbose --python-version 3.12 --product "Dyslexia Converter" --project DyslexiaConverter

      - uses: actions/upload-artifact@v4
        with:
          name: DyslexiaConverter-android
          path: build/apk/*.apk
          if-no-files-found: error
