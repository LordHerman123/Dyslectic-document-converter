name: Mac local-network check (temporary)

# Temporary diagnostic, to be removed: why macOS asks "Allow 'Python' to find devices on local networks?" when the
# app starts. Uses the macOS app of an earlier "Linux and macOS builds" run instead of building it again.
on:
  push:
    branches: [optimise-next]
    paths: [".github/workflows/mac-network-check.yml", ".github/scripts/mac-network-check.sh"]

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the sample files and settings need
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: DyslexiaConverter-macos
          run-id: 38214561231
          github-token: ${{ github.token }}

      - name: Unpack the app
        run: |
          mkdir -p build/macos
          ditto -x -k DyslexiaConverter-*-macos-arm64.zip build/macos
          ls -la build/macos

      - name: Start the app and watch what it does on the network
        run: bash .github/scripts/mac-network-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-network-check
          path: diag/
