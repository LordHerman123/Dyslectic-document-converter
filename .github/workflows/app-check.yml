name: App check

# Runs all tests on every push and pull request, including the app check (tests/test_app_check.py), which drives
# the real app through its screens (open a document, focus mode, the reading view) without a window. A crash in
# the app shows up here within minutes, before anything is released. The Windows release workflow runs the same
# tests again and also builds and self-tests the packaged app.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract (for the text recognition tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-nld

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run the tests and the app check
        run: python -m pytest -q
