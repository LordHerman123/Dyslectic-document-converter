[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyslexia-converter"
version = "1.15.0"
description = "Convert PDFs (papers, textbooks, reports) into cleaner, dyslexia-friendly, printable layouts without changing the text."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "reportlab>=4.0",
    "pyspellchecker>=0.8",
    "pyphen>=0.14",
    "rapidfuzz>=3.0",
    "python-docx>=1.1",
    "pillow>=10",
    "numpy>=1.24",
    "pytesseract>=0.3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
app = ["flet>=1.0,<2", "pyttsx3>=2.90", "pywin32>=306; sys_platform == 'win32'",
       "winrt-runtime>=2.3; sys_platform == 'win32'", "winrt-Windows.Media.SpeechSynthesis>=2.3; sys_platform == 'win32'", "winrt-Windows.Media.Core>=2.3; sys_platform == 'win32'", "winrt-Windows.Storage.Streams>=2.3; sys_platform == 'win32'", "winrt-Windows.Foundation>=2.3; sys_platform == 'win32'", "winrt-Windows.Foundation.Collections>=2.3; sys_platform == 'win32'"]
ai = ["anthropic>=1.0"]
keyring = ["keyring>=24"]
dev = ["pytest>=8", "fonttools>=4", "brotli"]

[project.scripts]
dyslexia-converter = "dyslexia_converter.cli:main"
dyslexia-converter-app = "dyslexia_converter.ui.app:run"

[tool.setuptools.packages.find]
include = ["dyslexia_converter*"]

[tool.setuptools.package-data]
dyslexia_converter = ["assets/fonts/*", "assets/*.webp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]

# Used by `flet build apk` / `flet build windows|macos|linux`
[tool.flet]
org = "org.dyslexiaconverter"
product = "Dyslexia Converter"
company = "Dyslexia Converter"

[tool.flet.app]
path = "."
exclude = ["tests", "windows", "docs", "tools", "dist", ".github", "benchmarks", "epubcheck-5.3.0-py3-none-any.whl",
           "tablib-3.10.0-py3-none-any.whl", "xlrd-2.0.2-py2.py3-none-any.whl", "xlwt-1.3.0-py2.py3-none-any.whl"]
# the build uses [project] dependencies plus these (the app itself, reading aloud, and dropping files on the window)

[tool.flet.windows]
dependencies = [
    "flet==1.0.1", "flet-dropzone==0.4.0", "pyttsx3>=2.90", "pywin32>=306",
    "winrt-runtime>=2.3", "winrt-Windows.Media.SpeechSynthesis>=2.3", "winrt-Windows.Media.Core>=2.3",
    "winrt-Windows.Storage.Streams>=2.3", "winrt-Windows.Foundation>=2.3",
    "winrt-Windows.Foundation.Collections>=2.3",
]

# flet-dropzone's Flutter side asks for flet ^0.80; it works with the flet 1.0.1 client this app is built with
[tool.flet.flutter.pubspec.dependency_overrides]
flet = "1.0.1"
